[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmd-search-web"
version = "2.1.0"
description = "High-efficiency CLI web research extraction toolkit for Antigravity"
readme = "SKILL.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rayhan Islam Shuvro" }
]
keywords = ["antigravity", "agent-skill", "search-web", "token-efficiency"]

[project.scripts]
cmd-search-web-export = "scripts.export_search:main"
cmd-search-web-list   = "scripts.list_searches:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true